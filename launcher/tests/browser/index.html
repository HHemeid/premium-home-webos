<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Home smoke tests</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0c0f; color: #e6e9ee; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { padding: 20px 24px 8px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; font-weight: 600; }
    #summary { font-weight: 600; }
    #summary.pass { color: #7ee2a8; }
    #summary.fail { color: #ff9b9b; }
    button { background: #1b1f26; color: inherit; border: 1px solid #333a44; border-radius: 8px; padding: 6px 14px; font: inherit; cursor: pointer; }
    main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1.2fr); gap: 16px; padding: 8px 24px 24px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 6px 8px; border-bottom: 1px solid #1f242c; vertical-align: top; }
    td.r { width: 56px; font-weight: 700; }
    .PASS { color: #7ee2a8; } .FAIL { color: #ff9b9b; } .RUN { color: #9fc9ff; }
    .err { color: #ffb3b3; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
    .frame-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid #1f242c; border-radius: 8px; overflow: hidden; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    p.note { margin: 0 24px; color: #8b93a1; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Premium Home browser smoke tests</h1>
    <span id="summary">Running…</span>
    <button id="rerun" type="button">Run again</button>
  </header>
  <p class="note">Drives the real app in the frame with TV remote key codes (arrows, OK 13, Back 461). Uses a separate test storage slot, makes no network requests and never contacts a TV.</p>
  <main>
    <table><tbody id="results"></tbody></table>
    <div class="frame-wrap"><iframe id="app" title="Premium Home under test"></iframe></div>
  </main>
  <script src="smoke.js"></script>
</body>
</html>
